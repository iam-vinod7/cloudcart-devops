services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: notesdb
      POSTGRES_USER: notesuser
      POSTGRES_PASSWORD: notespassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notesuser -d notesdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .

    ports:
      - "5000:5000"

    environment:
      DATABASE_URL: postgresql+psycopg://notesuser:notespassword@db:5432/notesdb

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
